    <link rel="icon" href="https://i.ibb.co/M6KTWnf/pic.jpg" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="../soco-embed.css" />
  </head>
  <body data-soco-theme="pacman">
    <div class="wrapper">
      <header class="header">
        <div class="scoreboard">
          <div class="score-label">
            Score:
            <span id="score">0</span>
          </div>
          <div class="lives-label">
            Lives:
            <span id="lives">3</span>
          </div>
          <button id="restartBtn" class="restart-btn">Restart 🔁</button>
        </div>
      </header>

      <main class="game-container">
        <canvas id="gameCanvas" width="560" height="620"></canvas>
        <div class="mobile-controls" aria-label="Pac-Man movement controls">
          <button type="button" class="direction-btn direction-up" data-direction="up" aria-label="Move up">↑</button>
          <button type="button" class="direction-btn direction-left" data-direction="left" aria-label="Move left">←</button>
          <button type="button" class="direction-btn direction-down" data-direction="down" aria-label="Move down">↓</button>
          <button type="button" class="direction-btn direction-right" data-direction="right" aria-label="Move right">→</button>
        </div>
      </main>
    </div>

    <script src="script.js"></script>
    <script src="../soco-audio.js"></script>
  </body>
</html>
