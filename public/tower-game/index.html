<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#f95240" />
    <title>Tower Stack</title>
    <style>
      @font-face { font-family: wenxue; src: url("./assets/wenxue.woff") format("woff"); }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #f95240 url("./assets/main-bg.png") center / cover; }
      body { display: grid; place-items: center; font-family: Arial, sans-serif; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
      .start-screen { position: relative; z-index: 2; display: grid; width: min(82%, 420px); justify-items: center; gap: 16px; text-align: center; color: #fff; text-shadow: 0 3px 0 #9b3f35; }
      .game-title { margin: 0; color: #fff5bf; font: 900 clamp(38px, 11vw, 70px)/.86 wenxue, Arial, sans-serif; letter-spacing: .02em; text-shadow: 0 5px 0 #9b3f35, 0 10px 24px #5e241c80; animation: swing 1.8s ease-in-out infinite alternate; }
      .game-title span { display: block; margin-bottom: 11px; color: #fff; font: 900 clamp(11px, 3vw, 16px)/1 Arial, sans-serif; letter-spacing: .22em; text-shadow: none; }
      .start-screen p { margin: 0; font-size: clamp(14px, 3.5vw, 19px); font-weight: 800; }
      .start-screen button { width: min(100%, 270px); padding: 16px 22px; border: 3px solid #fff8c5; border-radius: 999px; background: linear-gradient(#ffd768, #ff9d36); box-shadow: 0 6px 0 #b6532e, 0 12px 25px #68291b70; color: #7e311e; font: 900 clamp(19px, 5vw, 27px) wenxue, Arial, sans-serif; letter-spacing: .04em; cursor: pointer; }
      .start-screen button:active { box-shadow: 0 2px 0 #b6532e; transform: translateY(4px); }
      .start-screen button:disabled { cursor: wait; opacity: .75; }
      .start-screen.is-hidden { display: none; }
      .game-over { position: fixed; inset: 0; z-index: 4; display: none; place-items: center; padding: 22px; background: #24101ab8; backdrop-filter: blur(5px); }
      .game-over.is-visible { display: grid; }
      .game-over-card { width: min(100%, 340px); padding: 27px 23px; border: 3px solid #fff8c5; border-radius: 24px; background: linear-gradient(145deg, #fb704f, #d74742); box-shadow: 0 16px 45px #240a1588; text-align: center; color: #fff; }
      .game-over-card p { margin: 0; font: 900 13px/1 Arial, sans-serif; letter-spacing: .16em; }
      .game-over-card h2 { margin: 12px 0 7px; color: #fff5bf; font: 900 clamp(35px, 10vw, 54px)/.9 wenxue, Arial, sans-serif; text-shadow: 0 4px 0 #9b3f35; }
      .game-over-card span { display: block; margin-bottom: 20px; font-weight: 800; }
      .game-over-card button { width: 100%; padding: 14px 18px; border: 3px solid #fff8c5; border-radius: 999px; background: linear-gradient(#ffd768, #ff9d36); box-shadow: 0 5px 0 #b6532e; color: #7e311e; font: 900 22px wenxue, Arial, sans-serif; cursor: pointer; }
      .game-over-card button:active { transform: translateY(3px); box-shadow: 0 2px 0 #b6532e; }
      @keyframes swing { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
    </style>
  </head>
  <body>
    <canvas id="tower-canvas" aria-label="Tower stacking game"></canvas>
    <section class="start-screen" id="start-screen" aria-label="Start Tower Stack">
      <h1 class="game-title"><span>SOCO PLAY</span>TOWER<br />STACK</h1>
      <p>Tap when the swinging block lines up with your tower.</p>
      <button id="start-button" type="button">Start stacking</button>
    </section>
    <section class="game-over" id="game-over" aria-live="assertive" aria-label="Game over">
      <div class="game-over-card">
        <p>ROUND OVER</p>
        <h2>GAME OVER</h2>
        <span id="final-score">Score 0</span>
        <button id="play-again" type="button">Play again</button>
      </div>
    </section>
    <script src="./tower-game.js"></script>
    <script>
      (() => {
        const startButton = document.querySelector("#start-button");
        const startScreen = document.querySelector("#start-screen");
        const gameOver = document.querySelector("#game-over");
        const finalScore = document.querySelector("#final-score");
        const playAgain = document.querySelector("#play-again");
        let started = false;
        let score = 0;

        playAgain.addEventListener("click", () => window.location.reload());

        const showGameOver = () => {
          finalScore.textContent = `Score ${score}`;
          gameOver.classList.add("is-visible");
        };

        startButton.addEventListener("click", () => {
          if (started) return;
          started = true;
          startButton.disabled = true;
          startButton.textContent = "Loading…";

          const height = window.innerHeight;
          const width = height / window.innerWidth < 1.5 ? Math.ceil(height / 1.5) : window.innerWidth;
          const game = window.TowerGame({
            width,
            height,
            canvasId: "tower-canvas",
            soundOn: true,
            setGameScore: (nextScore) => { score = nextScore; },
            setGameFailed: (failedCount) => {
              if (failedCount >= 3) window.setTimeout(showGameOver, 350);
            },
          });

          game.load(() => {
            game.init();
            startScreen.classList.add("is-hidden");
            game.start();
            game.playBgm();
          }, ({ success, total, failed }) => {
            if (failed > 0) startButton.textContent = "Try again";
            else if (total) startButton.textContent = `Loading ${Math.min(99, Math.round((success / total) * 100))}%`;
          });
        });
      })();
    </script>
  </body>
</html>
